name: Build Android TV APK

on:
  push:
    branches:
      - main
      - feature/digital-signage
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with Gradle
        working-directory: ./android-tv
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Kathua Fresh TV APK
        uses: actions/upload-artifact@v4
        with:
          name: KathuaFreshTV-APK
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
